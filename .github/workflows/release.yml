name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version and release notes
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          pwsh scripts/extract-changelog.ps1 -Version "$VERSION" -OutputPath artifacts/release-notes.md
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build --no-restore -c Release --verbosity normal --logger trx --results-directory TestResults
      - name: E2E Tests
        run: pwsh test/e2e/run-e2e-tests.ps1 -ResultsDirectory TestResults/E2E -Logger trx
      - name: Pack
        run: |
          dotnet pack src/AttributedDI/AttributedDI.csproj --no-build --no-restore -c Release -o artifacts \
            -p:PackageVersion="${{ steps.release.outputs.version }}" \
            -p:PackageReleaseNotes="$(cat artifacts/release-notes.md)" \
            -p:ContinuousIntegrationBuild=true
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tests
          path: TestResults
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
      - name: Upload Symbol Packages
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: artifacts/*.snupkg
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
      - name: NuGet Login (Trusted Publishing)
        if: ${{ env.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
