name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
      ACTIONS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve version and release notes
        id: release
        shell: pwsh
        run: |
          $version = ($env:GITHUB_REF_NAME ?? '').TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not resolve version from GITHUB_REF_NAME."
          }
          Write-Host "Resolved version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          pwsh scripts/extract-changelog.ps1 -Version $version -OutputPath artifacts/release-notes.md
          Write-Host "Release notes written to artifacts/release-notes.md"
          if ($env:ACTIONS_STEP_DEBUG -eq 'true') {
            Write-Host "Release notes content:"
            Get-Content -Path artifacts/release-notes.md
          }
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build --no-restore -c Release --verbosity normal --logger trx --results-directory TestResults
      - name: E2E Tests
        run: pwsh test/e2e/run-e2e-tests.ps1 -ResultsDirectory TestResults/E2E -Logger trx -PackageOutputDirectory artifacts/e2e
      - name: Pack
        run: >
          dotnet pack src/AttributedDI/AttributedDI.csproj --no-build --no-restore -c Release -o artifacts/release
          -p:PackageVersion="${{ steps.release.outputs.version }}"
          -p:PackageReleaseNotes="https://github.com/dmytroett/AttributedDI/blob/main/CHANGELOG.md"
          -p:ContinuousIntegrationBuild=true
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tests
          path: TestResults
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/release/*.nupkg
      - name: Upload Symbol Packages
        uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: artifacts/release/*.snupkg
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
      - name: NuGet Login (Trusted Publishing)
        if: ${{ env.NUGET_USER != '' }}
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}
      - name: Publish to NuGet
        if: ${{ env.NUGET_USER != '' }}
        # dotnet nuget push will publish symbols automatically
        run: dotnet nuget push "artifacts/release/*.nupkg" --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
